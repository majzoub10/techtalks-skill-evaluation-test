<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile | Growvia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Changa+One:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-blue: #1a365d;
      --oxford-blue: #002147;
      --sage-green: #9caf88;
      --charcoal: #36454f;
      --light-gray: #f8f9fa;
      c
    }

    * { box-sizing: border-box; font-family: "Inter", sans-serif; margin:0; padding:0; }
    body { background: var(--light-gray); min-height:100vh; display:flex; justify-content:center; align-items:center; }

    .profile-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(26,54,93,0.12);
      border: 2px solid var(--navy-blue);
      text-align: center;
    }

    .profile-card h1 {
      font-family: 'Changa One', cursive;
      font-size: 28px;
      color: var(--oxford-blue);
      margin-bottom: 20px;
    }

    .pfp img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--navy-blue);
      box-shadow: 0 8px 24px rgba(26,54,93,0.2);
      margin-bottom: 15px;
    }

    .pfp input[type="file"] {
      margin-top: 10px;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .info {
      margin: 20px 0;
    }

    .info h3 {
      color: var(--navy-blue);
      font-size: 20px;
      margin-bottom: 8px;
    }

    .info p {
      color: var(--charcoal);
      font-size: 14px;
      line-height: 1.5;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

    input[type="text"], textarea {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.1);
      font-size: 14px;
      width: 100%;
    }

    textarea { resize: vertical; min-height: 80px; }

    button {
      padding: 12px 20px;
      background: var(--navy-blue);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: var(--sage-green);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(26,54,93,0.2);
    }
  </style>
</head>
<body>

<div class="profile-card">
  <h1>User Profile</h1>

  <div class="pfp">
    <img src="avatar-placeholder.png" alt="Profile Picture" id="profileImg">
    <input id="profilePicInput" type="file" accept="image/*" onchange="previewImage(event)">
  </div>

  <div class="info">
    <h3 id="displayName">Your Name</h3>
    <p id="displayBio">This is your bio. Tell us about yourself!</p>
  </div>

  <form>
    <input type="text" id="name" placeholder="Enter your name">
    <textarea id="bio" placeholder="Write a short bio"></textarea>
    <button type="button" onclick="updateProfile()">Save Changes</button>
  </form>
</div>

<script>
  function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function(){
      document.getElementById('profileImg').src = reader.result;
    }
    reader.readAsDataURL(event.target.files[0]);
  }

  function updateProfile() {
    const name = document.getElementById('name').value;
    const bio = document.getElementById('bio').value;
    if(name) document.getElementById('displayName').textContent = name;
    if(bio) document.getElementById('displayBio').textContent = bio;
  }
</script>

</body>
</html>
