<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Profile | Growvia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Changa+One:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-blue: #1a365d;
      --oxford-blue: #002147;
      --ivory: #fffff0;
      --cream: #f5f5dc;
      --sage-green: #9caf88;
      --burgundy: #800020;
      --gold: #d4af37;
      --terra-cotta: #e2725b;
      --charcoal: #36454f;
      --light-gray: #f8f9fa;
      --success-green: #28a745;
      --warning-orange: #ffc107;
      --error-red: #dc3545;
    }

    * { box-sizing: border-box; font-family: "Inter", sans-serif; margin:0; padding:0; }
    body { background: linear-gradient(135deg, var(--cream) 0%, var(--ivory) 100%); min-height:100vh; padding: 20px; color: var(--charcoal); }
    a { text-decoration: none; }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(26,54,93,0.12);
      border: 2px solid var(--navy-blue);
    }

    h1 {
      font-family: 'Changa One', cursive;
      font-size: 28px;
      color: var(--oxford-blue);
      margin-bottom: 20px;
      text-align: center;
    }

    .pfp {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }

    .pfp img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--navy-blue);
      box-shadow: 0 8px 24px rgba(26,54,93,0.2);
      margin-bottom: 15px;
    }

    .pfp input[type="file"] {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.1);
      cursor: pointer;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    label {
      font-weight: 600;
      color: var(--navy-blue);
      margin-bottom: 6px;
    }

    input[type="text"], textarea {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.1);
      font-size: 14px;
      width: 100%;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      padding: 12px 20px;
      background: var(--navy-blue);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: var(--sage-green);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(26,54,93,0.2);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--navy-blue);
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .container { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="container">
  <a href="dash.html" class="back-link">← Back to Dashboard</a>
  <h1>Edit Profile</h1>

  
 <div class="pfp">
    
     <div>
    <label for="profilePicInput" 
           style="margin-bottom:8px; font-weight:600; color: var(--navy-blue);">
     Profile Picture
    </label>
</div>
    
    <img src="avatar-placeholder.png" alt=" " id="profileImg" 
         style="margin-top:20px;"> 

   
    <input id="profilePicInput" type="file" accept="image/*" 
           onchange="previewImage(event)" 
           style="margin-top:5px;">
</div>


  <form action="#" method="POST">
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name">
    </div>

    <div>
      <label for="bio">Bio</label>
      <textarea id="bio" name="bio" placeholder="Write a short bio about yourself"></textarea>
    </div>

    <button type="submit">Save Changes</button>
  </form>
</div>

<script>
  
  function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function(){
      const output = document.getElementById('profileImg');
      output.src = reader.result;
    }
    reader.readAsDataURL(event.target.files[0]);
  }
</script>

</body>
</html>
