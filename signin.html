<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signin.css">
    <title>Sign Up</title>
</head>
<body>
    <form action="/submit-signup" method="POST" class="former">

    <p><label for="username">Name:</label></p>
    <input type="text" name="username" id="username" required>

    <p><label for="email">Email-address:</label></p>
    <input type="email" name="email" id="email" required placeholder="name@gmail.com">

    <p><label for="password">Create a password:</label></p>
    <input type="password" name="password" id="password" required placeholder="6 characters or more">

    <p><label for="confirm_password">Confirm your password:</label></p>
    <input type="password" name="confirm_password" id="confirm_password" required>

    <p>
        <button type="submit" id="submit">Submit and Continue</button>
        <button type="reset" id="reset">Clear</button>
    </p>

</form>
        
    </div> 
    <script> 
        window.onload = function () { 
        const form = document.querySelector(".former");
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let pass = document.getElementById("pass").value;
        let passConfirmation = document.getElementById("passC").value;
        let isValid = true;
        let count = 0;
        let fillout = document.getElementById("errors");
        const sub = document.getElementById("submit");
        form.addEventListener("submit", function(event){
            event.preventDefault();
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let pass = document.getElementById("pass").value;
            let passConfirmation = document.getElementById("passC").value;
            count = pass.length;
            if (name === "" || email === "" || pass === "" || passConfirmation === "") {
            fillout.textContent = "Please check unfilled fields."
            isValid = false;
        }
            if (count < 6) {
                fillout.textContent = "Password less than 6 characters."
            }
        if (pass !== passConfirmation) {
            fillout.textContent = "Passwords didn't match."
            isValid = false;
        }
        if (isValid) {
            form.submit();
        }
        }) 
         } 
    </script>
</body>
</html>
