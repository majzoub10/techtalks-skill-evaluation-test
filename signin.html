<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signin.css">
    <title>Sign Up</title>
</head>
<body>
    <header><h1 class="top">Create Your Account</h1></header>

    <div class="allbox">
        <div class="already">
        <a href="#">Already have an account?</a>
        </div>
        <div class="formbox">
        <form action="post" class="former">
            <p><label for="name" class="name" >Name: </label></p>
            <input type="text" name="name" id="name" required>
            <p><label for="email" class="email">Email-address: </label></p>
            <input type="email" name="email" id="email" required placeholder="name@gmail.com">
            <p><label for="pass" class="pass">Create a password: </label></p>
            <input type="password" name="pass" id="pass" required placeholder="6 characters or more">
            <p><label for="passConfirmation" class="passC">Confirm your password: </label></p>
            <input type="password" name="passConfirmation" id="passC" required>
            <p><button type="submit" id="submit"><a href="personalInfo.html">Submit and Continue</a></button>
            <button type="reset" id="reset">Clear</button></p>
            <p><div id="errors"> 
                
            </div></p>
        </form></div>
        
    </div> 
    <script> 
        window.onload = function () { 
        const form = document.querySelector(".former");
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let pass = document.getElementById("pass").value;
        let passConfirmation = document.getElementById("passC").value;
        let isValid = true;
        let count = 0;
        let fillout = document.getElementById("errors");
        const sub = document.getElementById("submit");
        form.addEventListener("submit", function(event){
            event.preventDefault();
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let pass = document.getElementById("pass").value;
            let passConfirmation = document.getElementById("passC").value;
            count = pass.length;
            if (name === "" || email === "" || pass === "" || passConfirmation === "") {
            fillout.textContent = "Please check unfilled fields."
            isValid = false;
        }
            if (count < 6) {
                fillout.textContent = "Password less than 6 characters."
            }
        if (pass !== passConfirmation) {
            fillout.textContent = "Passwords didn't match."
            isValid = false;
        }
        if (isValid) {
            form.submit();
        }
        }) 
         } 
    </script>
</body>
</html>
