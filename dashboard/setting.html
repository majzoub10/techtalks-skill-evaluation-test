<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>

  <style>
  /* Reset & Base */
  * {
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    transition: all 0.3s ease;
  }

  body {
    margin: 0;
    background: #f0f2f5;
    color: #1f2937;
  }

  .container {
    max-width: 800px;
    margin: 50px auto;
    background: #ffffff;
    border-radius: 12px;
    padding: 40px 35px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  }

  h1 {
    margin-bottom: 30px;
    font-size: 28px;
    font-weight: 700;
    color: #111827;
    border-bottom: 2px solid #e5e7eb;
    padding-bottom: 10px;
  }

  .section {
    margin-top: 40px;
  }

  .section h2 {
    margin-bottom: 20px;
    font-size: 20px;
    color: #1e293b;
    font-weight: 600;
    position: relative;
  }

  .section h2::after {
    content: '';
    position: absolute;
    width: 50px;
    height: 3px;
    background: #2563eb;
    left: 0;
    bottom: -5px;
    border-radius: 2px;
  }

  .field {
    margin-bottom: 20px;
  }

  .field label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #374151;
  }

  .field input[type="text"],
  .field input[type="password"],
  .field select {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }

  .field input[type="text"]:focus,
  .field input[type="password"]:focus,
  .field select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }

  .toggle {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .toggle input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: #2563eb;
    cursor: pointer;
  }

  button {
    margin-top: 10px;
    padding: 12px 20px;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }

  button:hover {
    background: #1e40af;
  }

  .danger {
    background: #ef4444;
  }

  .danger:hover {
    background: #b91c1c;
  }

  .status {
    margin-top: 15px;
    font-size: 14px;
    font-weight: 500;
    color: #10b981;
  }

</style>


</head>

<body>

<div class="container">
  <h1>Settings</h1>


  <!-- 🔐 PRIVACY & SECURITY -->
  <div class="section">
    <h2>Privacy & Security</h2>

    <div class="field">
      <label>Change Password</label>
      <input type="password" placeholder="New password">
    </div>

    <div class="field toggle">
      <label>Two-Factor Authentication</label>
      <input type="checkbox">
    </div>

    <div class="field toggle">
      <label>Make Profile Private</label>
      <input type="checkbox">
    </div>

    <button class="danger">Update Security</button>
  </div>

  <!-- ⚙️ PREFERENCES -->
  <div class="section">
    <h2>Preferences</h2>

    <div class="field toggle">
      <label>Dark Mode</label>
      <input type="checkbox" id="darkMode">
    </div>

    <div class="field">
      <label>Language</label>
      <select>
        <option>English</option>
        <option>French</option>
        <option>Arabic</option>
      </select>
    </div>

    <div class="field toggle">
      <label>Email Notifications</label>
      <input type="checkbox">
    </div>

    <button>Save Preferences</button>
  </div>

  <p class="status" id="status"></p>
</div>

<script>
  const status = document.getElementById("status");

  document.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      status.textContent = "Settings saved successfully!";
    });
  });

  document.getElementById("darkMode").addEventListener("change", (e) => {
    document.body.style.background = e.target.checked ? "#111827" : "#f4f6f8";
  });
</script>

</body>
</html>
